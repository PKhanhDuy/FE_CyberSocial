<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradient fill cho thân khiên -->
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Gradient viền phát sáng xanh cyan -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- Gradient điểm nhấn vàng cho trung tâm ổ khóa -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>

    <!-- Hiệu ứng viền phát sáng Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- LƯU Ý: Không sử dụng thẻ thẻ <rect> nền, đảm bảo trong suốt hoàn toàn -->

  <!-- Cụm chủ thể chính -->
  <g filter="url(#neonGlow)">
    <!-- Khiên bảo vệ chính -->
    <path d="M 250,50 
             C 340,50 410,75 410,75 
             C 410,260 340,380 250,440 
             C 160,380 90,260 90,75 
             C 90,75 160,50 250,50 Z" 
          fill="url(#shieldFill)" 
          stroke="url(#cyanGrad)" 
          stroke-width="8" 
          stroke-linejoin="round" />

    <!-- Đường viền trang trí chìm bên trong khiên -->
    <path d="M 250,75 
             C 325,75 385,95 385,95 
             C 385,245 325,350 250,405 
             C 175,350 115,245 115,95 
             C 115,95 175,75 250,75 Z" 
          fill="none" 
          stroke="url(#cyanGrad)" 
          stroke-width="2" 
          opacity="0.5" />

    <!-- Quai khóa phía trên -->
    <path d="M 195,190 V 160 C 195,125 220,105 250,105 C 280,105 305,125 305,160 V 190" 
          fill="none" 
          stroke="url(#cyanGrad)" 
          stroke-width="14" 
          stroke-linecap="round" />

    <!-- Đường nối các nút mạng xã hội -->
    <g stroke="url(#cyanGrad)" stroke-width="5" opacity="0.85">
      <line x1="160" y1="180" x2="250" y2="250" />
      <line x1="340" y1="180" x2="250" y2="250" />
      <line x1="160" y1="320" x2="250" y2="250" />
      <line x1="340" y1="320" x2="250" y2="250" />
      <line x1="160" y1="180" x2="160" y2="320" />
      <line x1="340" y1="180" x2="340" y2="320" />
    </g>

    <!-- Các nút liên kết mạng xã hội (Social Nodes) -->
    <circle cx="160" cy="180" r="16" fill="#0F172A" stroke="url(#cyanGrad)" stroke-width="5" />
    <circle cx="160" cy="180" r="6" fill="url(#cyanGrad)" />

    <circle cx="340" cy="180" r="16" fill="#0F172A" stroke="url(#cyanGrad)" stroke-width="5" />
    <circle cx="340" cy="180" r="6" fill="url(#cyanGrad)" />

    <circle cx="160" cy="320" r="16" fill="#0F172A" stroke="url(#cyanGrad)" stroke-width="5" />
    <circle cx="160" cy="320" r="6" fill="url(#cyanGrad)" />

    <circle cx="340" cy="320" r="16" fill="#0F172A" stroke="url(#cyanGrad)" stroke-width="5" />
    <circle cx="340" cy="320" r="6" fill="url(#cyanGrad)" />

    <!-- Ổ khóa trung tâm màu vàng nổi bật (Chủ thể bảo mật cốt lõi) -->
    <circle cx="250" cy="250" r="45" fill="#0F172A" stroke="url(#goldGrad)" stroke-width="6" />
    <circle cx="250" cy="250" r="32" fill="url(#goldGrad)" />
    
    <!-- Lỗ khóa -->
    <circle cx="250" cy="242" r="7" fill="#0F172A" />
    <polygon points="245,245 255,245 258,265 242,265" fill="#0F172A" />
  </g>
</svg>
